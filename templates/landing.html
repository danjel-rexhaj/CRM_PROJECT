{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="text-gray-700 body-font">
    <div class="container mx-auto flex px-5 py-24 items-center justify-center flex-col">
      <img class="mb-10 object-cover object-center rounded" style="width:96px;height:96px;" alt="EagleDrop CRM" src="{% static 'images/logo.svg' %}">
      <div class="text-center lg:w-2/3 w-full">
        <h1 class="title-font sm:text-4xl text-3xl mb-4 font-medium text-gray-900">
           EagleDrop CRM
        </h1>
        <p class="mb-8 leading-relaxed">
            This CRM helps you manage your leads.
        </p>
        <div class="flex justify-center gap-3">
          <a href="{% url 'login' %}" class="inline-flex text-white bg-indigo-500 border-0 py-2 px-6 focus:outline-none hover:bg-indigo-600 rounded text-lg">
            Login to get started
          </a>
          <a href="{% url 'signup' %}" class="inline-flex text-indigo-600 bg-white border border-indigo-500 py-2 px-6 focus:outline-none hover:bg-indigo-50 rounded text-lg">
            Sign up
          </a>
        </div>
      </div>
    </div>
</section>
{% endblock content %}
