{% load static %}
<aside class="app-sidebar">
    <a href="{% url 'dashboard' %}" class="app-sidebar-brand">
        <img src="{% static 'images/logo.svg' %}" alt="Logo">
        <span>EagleDrop CRM</span>
    </a>
    <nav class="app-sidebar-nav">
        {% if request.user.is_organisor %}
        <a href="{% url 'dashboard' %}" class="app-sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <span class="ic">&#9635;</span> Dashboard
        </a>
        {% endif %}
        <a href="{% url 'leads:lead-list' %}" class="app-sidebar-link {% if request.resolver_match.namespace == 'leads' %}active{% endif %}">
            <span class="ic">&#128100;</span> Leads
        </a>
        {% if request.user.is_organisor %}
        <a href="{% url 'agents:agent-list' %}" class="app-sidebar-link {% if request.resolver_match.namespace == 'agents' %}active{% endif %}">
            <span class="ic">&#128101;</span> Agjentët
        </a>
        {% endif %}
    </nav>
    <div class="app-sidebar-foot">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"><span class="ic">&#8676;</span> Dalja</button>
        </form>
    </div>
</aside>
